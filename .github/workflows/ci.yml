name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # The example's Playwright suite runs in the dedicated e2e job (browsers
      # are only installed there); keep its unit tests here.
      - run: pnpm -r --filter '!fumadocs-example' --filter '!fumadocs-editor-example' test
        env:
          CI: true
      - run: pnpm --filter fumadocs-example --filter fumadocs-editor-example test:unit
        env:
          CI: true

  e2e:
    name: e2e (${{ matrix.example.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - { dir: fumadocs, package: fumadocs-example }
          - { dir: fumadocs-editor, package: fumadocs-editor-example }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example consumes the packages through workspace overrides (pnpm-workspace.yaml), so build them first.
      - run: pnpm build
      - run: pnpm --filter ${{ matrix.example.package }} exec playwright install --with-deps chromium
      - run: pnpm --filter ${{ matrix.example.package }} test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.example.dir }}
          path: examples/${{ matrix.example.dir }}/playwright-report
          retention-days: 7
